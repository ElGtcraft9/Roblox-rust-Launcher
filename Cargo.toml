[package]
name = "rust-launcher"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Launcher alternativo para Roblox con interfaz de consola"
repository = "https://github.com/iker11094-cmyk/Roblox-rust-Launcher"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
futures-util = "0.3.34"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
keyring = "4.2.0"
md-5 = "0.11.0"
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "http2", "rustls", "gzip", "brotli", "zstd"] }
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Dependencias optimizadas también en depuración (decodificar PNG sin optimizar es muy lento).
[profile.dev.package."*"]
opt-level = 2
